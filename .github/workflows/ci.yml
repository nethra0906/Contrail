name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        # ml extras are needed here, not just for ml/train/* scripts: several
        # unit tests (chronological-split guard, ETA feature/dataset/report
        # tests - see tests/unit/test_eta_*.py, test_chronological_split.py)
        # import pandas/lightgbm transitively through ml/data and ml/eval.
        run: uv pip install --system -e ".[dev,ml]"
      - name: Lint
        run: ruff check services ml tests scripts
      - name: Unit tests
        run: pytest tests/unit -v --cov=services --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
