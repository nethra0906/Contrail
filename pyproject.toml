[project]
name = "contrail"
version = "0.1.0"
description = "Real-time airspace digital twin with counterfactual simulation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "aiokafka>=0.11",
    "httpx>=0.27",
    "h3>=4.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "orjson>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "tenacity>=8.5",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "polars>=1.5",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "openap>=1.5",
    "pyarrow>=17.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.108",
    "testcontainers>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "schemathesis>=3.32",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Query() are idiomatically used as argument
# defaults - that's the framework's dependency-injection mechanism, not a
# mutable-default footgun. Suppressed only for the API layer.
per-file-ignores = { "services/api/**/*.py" = ["B008"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services", "ml"]
markers = ["integration: requires a live Docker daemon (testcontainers)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "ml"]
